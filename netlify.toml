[build]
  # Ausgeliefert wird NUR dist/ (scripts/build-public.mjs, Positivliste). Bis 03.11.2026 war die
  # Repo-Wurzel Publish-Ordner und Repo-Interna waren öffentlich.
  command = "node scripts/build-public.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    # Geparkte Idee: nicht indexieren (zusätzlich zum Meta-Tag in index.html)
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
